name: deploy
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: "ghcr.io/catthehacker/ubuntu:act-22.04"
    steps:
      -
        name: checkout
        uses: actions/checkout@v4
      -
        name: build
        run: docker compose build
        with:
          python-version: 3.12
      -
        name: up
        run: docker compose up -d
      -
        name: prune
        run: docker image prune